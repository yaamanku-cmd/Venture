services:
  - type: web
    name: fraudshield-engine
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MODEL_PATH
        value: fraud_model.joblib
      - key: FRAUD_THRESHOLD
        value: "0.5"
      - key: TINYFISH_API_KEY
        value: sk-tinyfish-cum2hKLs-dzJ6XT87Bkjwc_WyeJY83PL
      - key: DATABASE_URL
        value: sqlite:///fraud_shield.db
      - key: PYTHON_VERSION
        value: 3.11.9
