services:
  # 1. Full-Stack Unified Service (FastAPI + React Dashboard + WebSockets + DB)
  - type: web
    name: fraudshield-engine
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MODEL_PATH
        value: fraud_model.joblib
      - key: FRAUD_THRESHOLD
        value: "0.5"
      - key: TINYFISH_API_KEY
        value: sk-tinyfish-cum2hKLs-dzJ6XT87Bkjwc_WyeJY83PL
      - key: DATABASE_URL
        value: sqlite:///fraud_shield.db
      - key: PYTHON_VERSION
        value: 3.11.9
